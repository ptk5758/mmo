<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>자리알림 — 위치 기반 마커 알림</title>
  <style>
    :root{--ink:#18211d;--muted:#718079;--green:#16845b;--green2:#35ac7b;--cream:#f6f5ef;--line:#e6e9e5;--white:#fff;--shadow:0 12px 36px rgba(24,48,37,.14)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;color:var(--ink);background:#dfe6e1}
    button,input,textarea{font:inherit}button{color:inherit}.stage{min-height:100vh;display:grid;place-items:center;padding:24px}
    .phone{position:relative;width:min(402px,100vw);height:min(874px,100vh);overflow:hidden;background:var(--cream);box-shadow:0 28px 80px rgba(25,43,35,.24)}
    .map{position:absolute;inset:0;background:#e9ede4;overflow:hidden}
    .map:before{content:"";position:absolute;inset:-15%;background:linear-gradient(24deg,transparent 45%,rgba(255,255,255,.95) 46% 49%,transparent 50%),linear-gradient(102deg,transparent 40%,rgba(255,255,255,.9) 41% 45%,transparent 46%),linear-gradient(158deg,transparent 52%,rgba(255,255,255,.85) 53% 57%,transparent 58%)}
    .water{position:absolute;width:170px;height:370px;right:-105px;top:95px;background:#c9e6e3;border-radius:48% 0 0 52%;transform:rotate(8deg)}
    .park{position:absolute;width:150px;height:115px;left:-24px;top:235px;background:#d3e7ca;border-radius:55% 45% 50% 35%;transform:rotate(-18deg)}
    .road{position:absolute;height:12px;width:520px;background:#fff;box-shadow:0 0 0 1px #dfe3dc;transform:rotate(-35deg);left:-65px;top:330px}.road.r2{transform:rotate(68deg);top:245px;left:-40px}
    .label{position:absolute;font-size:10px;font-weight:600;color:#89958e;letter-spacing:-.2px}.l1{top:200px;left:82px}.l2{top:325px;right:64px}.l3{top:418px;left:46px}
    .top{position:absolute;z-index:5;top:0;left:0;right:0;padding:max(18px,env(safe-area-inset-top)) 18px 0;display:flex;align-items:center;justify-content:space-between}
    .brand{background:rgba(255,255,255,.93);padding:10px 14px;border-radius:16px;box-shadow:0 5px 18px rgba(31,53,43,.1);font-weight:800;letter-spacing:-.5px}.brand i{color:var(--green);font-style:normal}
    .icon-btn{width:44px;height:44px;border:0;border-radius:15px;background:rgba(255,255,255,.94);box-shadow:0 5px 18px rgba(31,53,43,.11);display:grid;place-items:center;cursor:pointer}.icon-btn svg{width:21px}
    .tools{position:absolute;z-index:4;right:16px;top:92px;display:grid;gap:10px}.tools .icon-btn{width:42px;height:42px;border-radius:14px}
    .marker{position:absolute;z-index:3;border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 5px 6px rgba(23,56,40,.18));transition:.2s}.marker span{display:grid;place-items:center;width:43px;height:43px;border:4px solid white;border-radius:50% 50% 50% 10%;background:var(--green);color:#fff;transform:rotate(-45deg)}.marker svg{width:19px;transform:rotate(45deg)}
    .marker.active{transform:scale(1.16) translateY(-4px)}.marker.active span{background:#f28b4a}.m1{top:188px;left:170px}.m2{top:304px;left:74px}.m3{top:340px;right:72px}
    .me{position:absolute;z-index:2;top:275px;left:194px;width:18px;height:18px;border:4px solid #fff;background:#3187ef;border-radius:50%;box-shadow:0 0 0 14px rgba(49,135,239,.13)}
    .fab{position:absolute;z-index:8;right:18px;bottom:326px;width:54px;height:54px;border:0;border-radius:18px;background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(20,38,30,.25);font-size:27px;cursor:pointer;transition:bottom .25s}
    .sheet.expanded~.fab{bottom:620px}
    .sheet{position:absolute;z-index:7;left:0;right:0;bottom:0;height:302px;padding:9px 20px 24px;background:rgba(255,255,255,.97);border-radius:28px 28px 0 0;box-shadow:0 -8px 34px rgba(36,61,49,.12);transition:height .3s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(18px)}.sheet.expanded{height:598px}
    .grab{width:42px;height:5px;background:#d8ddd9;border-radius:9px;margin:0 auto 16px;cursor:pointer}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet h1{font-size:21px;letter-spacing:-.8px;margin:0}.count{font-size:13px;color:var(--muted);margin-left:6px}.text-btn{border:0;background:none;color:var(--green);font-weight:700;cursor:pointer}
    .cards{display:grid;gap:11px;overflow:auto;max-height:500px;padding-bottom:28px;scrollbar-width:none}.card{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;background:#fff;padding:13px;cursor:pointer}.card:hover{border-color:#9fcdb8}.card-icon{width:48px;height:48px;border-radius:15px;background:#e8f4ed;color:var(--green);display:grid;place-items:center}.card-icon svg{width:22px}.card b{font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.badge{font-size:11px;font-weight:700;color:var(--green);background:#e7f5ed;padding:6px 8px;border-radius:10px}.badge.off{color:#7a817d;background:#eff1ef}
    .detail{display:none}.detail.on{display:block}.list.hidden{display:none}.detail-top{display:flex;align-items:flex-start;justify-content:space-between}.eyebrow{font-size:12px;color:var(--green);font-weight:700;margin-bottom:5px}.detail h2{font-size:24px;margin:0 0 7px;letter-spacing:-1px}.detail p{font-size:14px;color:var(--muted);margin:0;line-height:1.5}.distance{display:flex;gap:10px;margin:18px 0}.stat{flex:1;background:#f5f7f4;padding:12px;border-radius:15px}.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.stat strong{font-size:14px}.notice{padding:14px;background:#e9f5ef;border-radius:16px;font-size:13px;line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:15px;padding:14px;font-weight:750;cursor:pointer}.btn.primary{background:var(--green);color:#fff}.btn.light{background:#f0f2ef}.delete{width:100%;margin-top:10px;background:none;border:0;color:#d04c42;font-weight:700;padding:8px;cursor:pointer}
    .modal{position:absolute;z-index:20;inset:0;background:rgba(18,28,23,.32);display:none;align-items:flex-end}.modal.on{display:flex}.panel{width:100%;max-height:91%;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}.panel-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0 20px}.panel-head h2{font-size:21px;margin:0}.close{border:0;background:#f0f2ef;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #dfe4df;background:#fafbf9;border-radius:14px;padding:13px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--green)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.switch{width:48px;height:29px;padding:3px;border:0;border-radius:18px;background:var(--green);cursor:pointer}.switch:after{content:"";display:block;width:23px;height:23px;background:#fff;border-radius:50%;margin-left:19px;transition:.2s}.switch.off{background:#cdd2ce}.switch.off:after{margin-left:0}.save{width:100%;margin-top:12px}
    .toast{position:absolute;z-index:30;left:50%;bottom:32px;transform:translate(-50%,20px);opacity:0;background:#17231d;color:#fff;padding:13px 18px;border-radius:14px;font-size:13px;white-space:nowrap;transition:.25s}.toast.on{opacity:1;transform:translate(-50%,0)}
    @keyframes up{from{transform:translateY(60px);opacity:.5}}@media(max-width:440px){.stage{padding:0}.phone{width:100vw;height:100dvh}}
  </style>
</head>
<body>
<main class="stage"><section class="phone" aria-label="iPhone 17 위치 기반 마커 알림 앱 프로토타입">
  <div class="map"><div class="water"></div><div class="park"></div><div class="road"></div><div class="road r2"></div><span class="label l1">성수동 카페거리</span><span class="label l2">서울숲</span><span class="label l3">뚝섬역</span></div>
  <header class="top"><div class="brand"><i>자리</i>알림</div><button class="icon-btn" id="settings" aria-label="권한 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg></button></header>
  <div class="tools"><button class="icon-btn" aria-label="내 위치" onclick="toast('현재 위치로 이동했어요')">⌖</button><button class="icon-btn" aria-label="지도 확대" onclick="toast('지도를 확대했어요')">＋</button></div>
  <button class="marker m1" data-name="회사" aria-label="회사 마커"><span>⌂</span></button><button class="marker m2" data-name="단골 카페" aria-label="단골 카페 마커"><span>●</span></button><button class="marker m3" data-name="서울숲" aria-label="서울숲 마커"><span>♧</span></button><div class="me"></div>
  <section class="sheet" id="sheet"><div class="grab" id="grab"></div>
    <div class="list" id="list"><div class="sheet-head"><div><h1>내 장소 <span class="count">3개</span></h1></div><button class="text-btn" id="expand">전체보기</button></div><div class="cards">
      <article class="card" data-name="회사"><div class="card-icon">⌂</div><div><b>회사</b><div class="meta">반경 150m · 1.2km</div></div><span class="badge">추적 중</span></article>
      <article class="card" data-name="단골 카페"><div class="card-icon">●</div><div><b>단골 카페</b><div class="meta">반경 100m · 680m</div></div><span class="badge">추적 중</span></article>
      <article class="card" data-name="서울숲"><div class="card-icon">♧</div><div><b>서울숲</b><div class="meta">반경 300m · 2.4km</div></div><span class="badge off">꺼짐</span></article>
    </div></div>
    <div class="detail" id="detail"><div class="detail-top"><div><div class="eyebrow">알림 장소</div><h2 id="detailName">회사</h2><p>서울 성동구 왕십리로 83-21</p></div><button class="close" id="back">×</button></div><div class="distance"><div class="stat"><small>현재 거리</small><strong>1.2 km</strong></div><div class="stat"><small>알림 반경</small><strong>150 m</strong></div><div class="stat"><small>상태</small><strong style="color:var(--green)">추적 중</strong></div></div><div class="notice"><b>“회사 근처예요”</b><br>설정한 장소에 진입하면 이 알림을 보내드려요.</div><div class="actions"><button class="btn light" onclick="toast('알림 추적을 잠시 껐어요')">알림 끄기</button><button class="btn primary" onclick="openForm(true)">수정하기</button></div><button class="delete" onclick="toast('삭제 확인이 필요해요')">이 장소 삭제</button></div>
  </section>
  <button class="fab" id="add" aria-label="새 마커 등록">＋</button>
  <div class="modal" id="form"><div class="panel"><div class="grab"></div><div class="panel-head"><h2 id="formTitle">새 장소 등록</h2><button class="close" onclick="closeForm()">×</button></div><div class="field"><label>선택한 위치</label><input value="서울 성동구 성수동 1가" readonly></div><div class="field"><label>장소 이름</label><input id="placeName" placeholder="예: 우리 집, 회사"></div><div class="field"><label>설명 (선택)</label><input placeholder="장소를 기억할 수 있는 설명"></div><div class="row"><div class="field"><label>알림 반경</label><input value="150 m"></div><div class="field"><label>알림 제목</label><input value="근처에 도착했어요"></div></div><div class="field"><label>알림 내용</label><textarea rows="2">설정한 장소 반경 안에 들어왔어요.</textarea></div><div class="switch-row"><div><b>알림 활성화</b><div class="meta">백그라운드에서 위치를 확인해요</div></div><button class="switch" aria-label="알림 활성화"></button></div><div class="switch-row"><div><b>첫 방문 후 자동 완료</b><div class="meta">한 번 알린 후 추적을 종료해요</div></div><button class="switch off" aria-label="자동 완료"></button></div><button class="btn primary save" onclick="savePlace()">장소 저장하기</button></div></div>
  <div class="toast" id="toast"></div>
</section></main>
<script>
  const sheet=document.querySelector('#sheet'),list=document.querySelector('#list'),detail=document.querySelector('#detail'),form=document.querySelector('#form');
  function toggleSheet(force){sheet.classList.toggle('expanded',force??!sheet.classList.contains('expanded'));document.querySelector('#expand').textContent=sheet.classList.contains('expanded')?'접기':'전체보기'}
  document.querySelector('#grab').onclick=()=>toggleSheet();document.querySelector('#expand').onclick=()=>toggleSheet();
  function showDetail(name){document.querySelectorAll('.marker').forEach(m=>m.classList.toggle('active',m.dataset.name===name));document.querySelector('#detailName').textContent=name;list.classList.add('hidden');detail.classList.add('on');sheet.classList.add('expanded')}
  document.querySelectorAll('.marker,.card').forEach(el=>el.onclick=()=>showDetail(el.dataset.name));
  document.querySelector('#back').onclick=()=>{detail.classList.remove('on');list.classList.remove('hidden');document.querySelectorAll('.marker').forEach(m=>m.classList.remove('active'));sheet.classList.remove('expanded')};
  document.querySelector('#add').onclick=()=>openForm(false);function openForm(edit){form.classList.add('on');document.querySelector('#formTitle').textContent=edit?'장소 수정':'새 장소 등록';document.querySelector('#placeName').value=edit?document.querySelector('#detailName').textContent:''}function closeForm(){form.classList.remove('on')}
  form.onclick=e=>{if(e.target===form)closeForm()};document.querySelectorAll('.switch').forEach(s=>s.onclick=()=>s.classList.toggle('off'));
  function savePlace(){closeForm();toast(document.querySelector('#formTitle').textContent==='장소 수정'?'변경사항을 저장했어요':'새 장소를 등록했어요')}
  let timer;function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('on'),1800)}
  document.querySelector('#settings').onclick=()=>toast('위치 권한 항상 허용 · 알림 허용');
</script>
</body></html>
